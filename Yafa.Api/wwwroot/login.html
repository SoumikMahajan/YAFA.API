<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAFA &mdash; Admin Login</title>
    <link rel="icon" type="image/png" href="./YAFA_1.png">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <link href="Style.css" rel="stylesheet" />

</head>
<body>
    <div class="login-wrapper">

        <!-- Logo -->
        <div class="logo-area">
            <!--<div class="logo-badge">Y</div>
            <p class="logo-title">YAFA</p>-->
            <!--<div class="logo-badge">Y</div>-->
            <!--<img src="yafa_logo.png" alt="YAFA Logo" class="logo-img" />-->
            <img src="YAFA_1.png" alt="YAFA Logo" class="logo-img" />
            <p class="logo-subtitle">Villa Management &bull; Admin Portal</p>
        </div>

        <!-- Card -->
        <div class="login-card">
            <p class="card-heading">Welcome back</p>
            <p class="card-sub">Sign in to access the API documentation</p>

            <!-- Error alert (hidden by default) -->
            <div class="alert-area" id="alertArea" style="display:none;">
                <div class="alert-box">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="alertMsg">Invalid email or password.</span>
                </div>
            </div>

            <!-- Form -->
            <form id="loginForm" novalidate autocomplete="off">

                <!-- Email -->
                <div class="mb-3">
                    <label for="email">Email Address</label>
                    <div class="input-group-custom">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="admin@yafa.com"
                               autocomplete="username"
                               required />
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password">Password</label>
                    <div class="input-group-custom">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                               autocomplete="current-password"
                               required />
                        <button type="button"
                                class="pwd-toggle"
                                id="pwdToggle"
                                title="Show / hide password">
                            <i class="bi bi-eye" id="pwdIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="remember-row">
                    <input class="form-check-input" type="checkbox" id="rememberMe" />
                    <label class="form-check-label" for="rememberMe">
                        Remember me for 6 days
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Sign In</span>
                </button>

            </form>
        </div>

        <p class="login-footer">
            <i class="bi bi-shield-lock me-1"></i>
            Secured &bull; Administrators only
        </p>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"  crossorigin="anonymous"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"  crossorigin="anonymous"></script>
    <script src="JavaScript.js"></script>
</body>
</html>
